<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 170" width="1060" height="170" role="img" aria-label="服务端证据"><title>服务端证据</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .t { fill: #1f2328; font-weight: 600; }
  .m { fill: #59636e; }
  .ln { stroke: #8c959f; stroke-width: 1.5; fill: none; }
  .ah { fill: #8c959f; }
  .cl { fill: #c15f3c; } .cx { fill: #0969da; } .sv { fill: #1a7f37; }
  .lnc { stroke: #c15f3c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .ahc { fill: #c15f3c; }
  .lbl { fill: #59636e; font-size: 12.5px; }
  .lblc { fill: #c15f3c; font-size: 12.5px; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #161b22; stroke: #3d444d; }
    .t { fill: #e6edf3; } .m, .lbl { fill: #9198a1; }
    .ln { stroke: #6e7681; } .ah { fill: #6e7681; }
    .cl, .ahc, .lblc { fill: #e08a68; } .lnc { stroke: #e08a68; }
    .cx { fill: #4493f8; } .sv { fill: #3fb950; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahc"/></marker>
</defs>
<text x="15" y="30" class="lbl">Codex 退出后，服务端自己检查，不信交接的一面之词</text>
<rect x="15" y="60" width="190" height="84" rx="10" class="card"/>
<circle cx="29" cy="76" r="3.5" class="cx"/>
<text x="38" y="80" class="cx" font-size="10.5" letter-spacing="0.6">CODEX</text>
<text x="110.0" y="108" class="t" text-anchor="middle" font-size="13.5">实现并交接</text>
<text x="110.0" y="128" class="m" text-anchor="middle" font-size="12">交接里说“完成了”</text>
<line x1="208" y1="102.0" x2="222" y2="102.0" class="ln" marker-end="url(#a)"/>
<rect x="225" y="60" width="190" height="84" rx="10" class="card"/>
<circle cx="239" cy="76" r="3.5" class="sv"/>
<text x="248" y="80" class="sv" font-size="10.5" letter-spacing="0.6">SERVER</text>
<text x="320.0" y="108" class="t" text-anchor="middle" font-size="13.5">干净快照里重跑</text>
<text x="320.0" y="128" class="m" text-anchor="middle" font-size="12">verify_commands</text>
<line x1="418" y1="102.0" x2="432" y2="102.0" class="ln" marker-end="url(#a)"/>
<rect x="435" y="60" width="190" height="84" rx="10" class="card"/>
<circle cx="449" cy="76" r="3.5" class="sv"/>
<text x="458" y="80" class="sv" font-size="10.5" letter-spacing="0.6">SERVER</text>
<text x="530.0" y="108" class="t" text-anchor="middle" font-size="13.5">撤掉实现再跑一次</text>
<text x="530.0" y="128" class="m" text-anchor="middle" font-size="12">还能通过 = 测试没用</text>
<line x1="628" y1="102.0" x2="642" y2="102.0" class="ln" marker-end="url(#a)"/>
<rect x="645" y="60" width="190" height="84" rx="10" class="card"/>
<circle cx="659" cy="76" r="3.5" class="sv"/>
<text x="668" y="80" class="sv" font-size="10.5" letter-spacing="0.6">SERVER</text>
<text x="740.0" y="108" class="t" text-anchor="middle" font-size="13.5">标记可疑改动</text>
<text x="740.0" y="128" class="m" text-anchor="middle" font-size="12">改了测试 · 越界文件</text>
<line x1="838" y1="102.0" x2="852" y2="102.0" class="ln" marker-end="url(#a)"/>
<rect x="855" y="60" width="190" height="84" rx="10" class="card"/>
<circle cx="869" cy="76" r="3.5" class="cl"/>
<text x="878" y="80" class="cl" font-size="10.5" letter-spacing="0.6">CLAUDE</text>
<text x="950.0" y="108" class="t" text-anchor="middle" font-size="13.5">先看证据再审查</text>
<text x="950.0" y="128" class="m" text-anchor="middle" font-size="12">证据决定成败</text>
</svg>
